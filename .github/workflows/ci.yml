name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -e .[dev]

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -e .[dev]

      - name: Pytest (avec couverture)
        shell: bash
        run: set -o pipefail; pytest --cov-report=xml --cov-fail-under=85 2>&1 | tee pytest-output.txt

      - name: Ouvrir une issue de diagnostic en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        env:
          JOB_LABEL: ${{ matrix.os }} / py${{ matrix.python }}
        with:
          script: |
            const fs = require('fs');
            const label = process.env.JOB_LABEL;
            const title = `CI en échec : tests ${label}`;
            const body = "```\n" +
              fs.readFileSync('pytest-output.txt', 'utf8').slice(-6000) +
              "\n```\n\n_Issue ouverte automatiquement par la CI. Fermeture manuelle après correction._";
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', creator: 'github-actions[bot]'
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: dup.number, body
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
