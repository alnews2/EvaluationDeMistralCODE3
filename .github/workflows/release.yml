name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: quatre-ops
            artifact: quatre-ops-linux
          - os: windows-latest
            binary: quatre-ops.exe
            artifact: quatre-ops-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le projet et PyInstaller
        run: python -m pip install -e .[build]

      - name: Construire l'exécutable autonome
        run: pyinstaller --noconfirm --clean --onefile --windowed --name quatre-ops --paths src --collect-submodules PySide6 main.py

      - name: Renommer avec le tag (hors Windows)
        if: matrix.os != 'windows-latest'
        run: cp dist/${{ matrix.binary }} dist/${{ matrix.artifact }}-${{ github.ref_name }}

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          pattern: quatre-ops-*
          merge-multiple: true
          path: bin

      - name: Vérifier que le binaire existe et est exécutable
        shell: bash
        run: |
          ls -la bin/
          test -x bin/quatre-ops || test -f bin/quatre-ops.exe

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Télécharger tous les binaires
        uses: actions/download-artifact@v4
        with:
          pattern: quatre-ops-*
          merge-multiple: true
          path: dist

      - name: Créer la release avec les binaires joints
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
