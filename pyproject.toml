[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quatre-ops"
version = "0.1.0"
description = "Calculatrice à quatre opérations — démonstration d'un socle applicatif PySide6 de qualité"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A C" }]
keywords = ["calculator", "pyside6", "qt", "demo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "PySide6>=6.6,<7",
]

[project.scripts]
quatre-ops = "calculator.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
build = [
    "pyinstaller>=6.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calculator"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "N",   # pep8-naming (API Qt : keyPressEvent → noqa N802 justifié)
    "SLF", # accès aux membres privés (tests → noqa SLF001 justifié)
    "RUF", # ruff-specific (dont RUF100 : noqa inutile = erreur)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=calculator --cov-report=term-missing"
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["src/calculator"]
